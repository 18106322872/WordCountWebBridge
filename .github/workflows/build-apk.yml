name: Build WordCount Web Bridge APK

# 触发：打 tag `apk`（git tag apk && git push --tags）或手动触发
on:
  push:
    tags: ['apk']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # android-actions/setup-android@v3 已失效：runner 镜像 cmdline-tools 16.0 移除 'tools' 包，
      # action 内部 sdkmanager 装 'tools' 报 "Failed to find package 'tools'" exit 1。
      # ubuntu-latest 镜像自带完整 Android SDK（$ANDROID_HOME），直接装齐所需组件即可。
      - name: Setup Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Build debug APK
        run: |
          gradle clean --no-daemon
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK (with version)
        id: apkver
        run: |
          VER=$(grep -oP 'versionName\s+"\K[0-9.]+' app/build.gradle | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/WordCountWebBridge-v${VER}.apk"
          echo "APK file: WordCountWebBridge-v${VER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: wordcount-web-bridge-apk
          path: app/build/outputs/apk/debug/WordCountWebBridge-v${{ steps.apkver.outputs.version }}.apk

      - name: Delete existing release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete apk --yes || true

      - name: "Create Release (tag: apk)"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk
          name: WordCount 网页版桥接 APK
          make_latest: true
          files: app/build/outputs/apk/debug/WordCountWebBridge-v${{ steps.apkver.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
